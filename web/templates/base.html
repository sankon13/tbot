<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ZAKUP{% endblock %}</title>
<style>
 body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f2f4f8;color:#1c2333}
 header{background:#1f3b73;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
 header a{color:#cfe0ff;text-decoration:none;font-size:14px}
 main{max-width:720px;margin:0 auto;padding:12px}
 .card{background:#fff;border-radius:10px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
 .muted{color:#68718a;font-size:13px}
 .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:#dfe3ec;color:#333}
 .badge.ok{background:#d3f2d9;color:#116632}.badge.run{background:#d7e6ff;color:#1d4fb8}
 .badge.err{background:#fdd8d8;color:#a11}.badge.warn{background:#ffe9c2;color:#8a5b00}
 h1{font-size:18px;margin:14px 0 4px}
 .btn{display:inline-block;background:#1f3b73;color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none;margin-top:6px}
 input[type=password]{width:100%;padding:10px;margin:8px 0;border:1px solid #c6cddd;border-radius:8px;font-size:16px;box-sizing:border-box}
 button{background:#1f3b73;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-size:16px}
</style>
</head>
<body>
<header><b>📦 ZAKUP — поставщики</b>{% block headerlink %}<a href="/logout">Выйти</a>{% endblock %}</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
