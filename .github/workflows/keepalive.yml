name: Keep-alive ping Render
on:
  schedule:
    - cron: "*/10 * * * *"  # каждые 10 минут
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bot
        run: |
          if [ -n "$RENDER_URL" ]; then
            curl -s -o /dev/null -w "HTTP %{http_code}" --max-time 30 "$RENDER_URL" || echo "ping failed"
          else
            echo "RENDER_URL not set"
          fi
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
